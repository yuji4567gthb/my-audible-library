<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Audible Library</title>
<meta name="description" content="Audibleで聴き終わった本を記録する個人用ライブラリ">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#252525;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:16px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0}h2{margin-top:0}main{max-width:1050px;margin:24px auto;padding:0 16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#222;color:white}button.alt{background:#e9e9e9;color:#222}input,select,textarea{padding:11px;border:1px solid #ccc;border-radius:9px;min-width:0;width:100%;background:white}label{display:grid;gap:5px;font-size:13px}form{display:grid;gap:12px}.panel{max-width:440px;margin:45px auto;background:white;border-radius:16px;padding:24px}.muted{color:#777;font-size:13px}.error{color:#a32;white-space:pre-wrap}.ok{color:#17653b}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}.book{background:white;color:#222;text-align:left;border-radius:12px;padding:10px;box-shadow:0 2px 10px #0001}.cover{width:100%;aspect-ratio:3/4;object-fit:contain;background:#eee;border-radius:7px}.placeholder{display:grid;place-items:center;color:#888}.bookname{font-weight:650;margin:8px 0 4px;overflow-wrap:anywhere}.stars{color:#aa7820}.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:2}.dialog{background:white;padding:22px;border-radius:16px;width:min(100%,570px);max-height:95vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px}
</style></head><body>
<header><div><h1>My Audible Library</h1><div class="muted" id="count">聴き終わった本の記録</div></div><div><button id="add" class="hidden">＋ 登録</button> <button id="logout" class="alt hidden">ログアウト</button></div></header>
<main><section id="auth" class="panel"><h2>ログイン</h2><p class="muted">メールアドレスとパスワードで本棚にアクセスします。</p><form id="authform"><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><label>パスワード<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="login" type="submit">ログイン</button><button id="signup" type="button" class="alt">新規アカウント登録</button><div id="authmsg" role="status" aria-live="polite" class="muted"></div></form></section>
<section id="library" class="hidden"><div class="toolbar"><input id="search" type="search" placeholder="タイトル・著者を検索"><select id="sort"><option value="new">登録順</option><option value="title">タイトル順</option><option value="author">著者順</option><option value="rating">評価順</option></select><select id="filter"><option value="all">すべて</option><option value="fav">♥ お気に入り</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option><option value="none">未評価</option></select></div><p id="notice" class="muted"></p><div id="books" class="grid"></div><p id="empty" class="muted">まだ書籍がありません。「＋ 登録」から追加してください。</p></section></main>
<div id="overlay" class="overlay hidden"><div class="dialog"><h2 id="dialogTitle">書籍登録</h2><form id="bookform"><label>Audible共有URL（任意）<input id="audible" placeholder="https://www.audible.co.jp/pd/..."></label><div><button id="autofill" type="button" class="alt">Audibleから書籍情報を取得</button><p id="metamsg" class="muted" role="status" aria-live="polite"></p></div><label>タイトル *<input id="title" required></label><label>著者（カンマ区切り）<input id="authors"></label><label>ナレーター（カンマ区切り）<input id="narrators"></label><div class="two"><label>ジャンル<input id="genre"></label><label>聴了日<input id="finished" type="date"></label></div><label>表紙画像URL<input id="cover" type="url"></label><label>概要<textarea id="description" rows="3"></textarea></label><label>評価<select id="rating"><option value="">未評価</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></label><label style="display:flex;align-items:center;gap:8px"><input id="favorite" type="checkbox" style="width:auto">もう一度聴きたい ♥</label><label>感想・メモ<textarea id="notes" rows="4"></textarea></label><div id="savemsg" class="error" role="status"></div><div class="actions"><button id="delete" type="button" class="alt hidden">削除</button><button id="cancel" type="button" class="alt">閉じる</button><button type="submit">保存</button></div></form></div></div>
<script>
'use strict';
const BASE='https://yqjemihzbuuhxsoyzkii.supabase.co',KEY='sb_publishable_v_klJ4gjzQ_K6BNtgB-AXA_oiuGb37W',el=id=>document.getElementById(id);
let session=null,books=[],editing=null;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const message=(id,s,kind='')=>{el(id).textContent=s;el(id).className=kind||'muted'};
async function api(path,options={}){
 const headers={'apikey':KEY,'Content-Type':'application/json'};
 if(options.auth!==false&&session?.access_token)headers.Authorization='Bearer '+session.access_token;
 if(options.prefer)headers.Prefer=options.prefer;
 let response;
 try{response=await fetch(BASE+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)})}catch(e){throw Error('通信できません。ネットワーク接続を確認してください。 '+e.message)}
 let data=await response.text();try{data=JSON.parse(data)}catch{}
 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'HTTP '+response.status);
 return data;
}
function setAuth(on){el('auth').classList.toggle('hidden',on);el('library').classList.toggle('hidden',!on);el('add').classList.toggle('hidden',!on);el('logout').classList.toggle('hidden',!on)}
function saveSession(s){session=s;localStorage.setItem('my_audible_session',JSON.stringify(s))}
function logout(){session=null;books=[];localStorage.removeItem('my_audible_session');setAuth(false);message('count','聴き終わった本の記録')}
async function refresh(){if(!session?.refresh_token)return false;try{saveSession(await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},auth:false}));return true}catch{logout();return false}}
async function authed(path,options){try{return await api(path,options)}catch(e){if(/JWT expired|invalid JWT/i.test(e.message)&&await refresh())return api(path,options);throw e}}
el('logout').onclick=logout;
el('authform').onsubmit=async e=>{e.preventDefault();message('authmsg','ログイン中…');try{saveSession(await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:el('email').value.trim(),password:el('password').value},auth:false}));setAuth(true);await load()}catch(e){message('authmsg',e.message,'error')}};
el('signup').onclick=async()=>{if(!el('authform').reportValidity())return;message('authmsg','登録中…');el('signup').disabled=true;try{const r=await api('/auth/v1/signup',{method:'POST',body:{email:el('email').value.trim(),password:el('password').value},auth:false});if(r.access_token){saveSession(r);setAuth(true);await load()}else message('authmsg','登録を受け付けました。確認メールが届いたら、メール内のリンクを開いてからログインしてください。','ok')}catch(e){message('authmsg','新規登録エラー: '+e.message,'error')}finally{el('signup').disabled=false}};
async function load(){try{books=await authed('/rest/v1/books?select=*&order=created_at.desc');render();message('notice','')}catch(e){message('notice','読み込みエラー: '+e.message,'error')}}
function render(){
 let q=el('search').value.trim().toLowerCase(),f=el('filter').value,s=el('sort').value;
 let list=books.filter(b=>[b.title,...(b.authors||[]),b.genre,b.description].join(' ').toLowerCase().includes(q)).filter(b=>f==='all'||(f==='fav'?b.favorite:f==='none'?b.rating==null:b.rating===Number(f)));
 list.sort((a,b)=>s==='title'?a.title.localeCompare(b.title,'ja'):s==='author'?(a.authors?.[0]||'').localeCompare(b.authors?.[0]||'','ja'):s==='rating'?(b.rating||0)-(a.rating||0):(b.created_at||'').localeCompare(a.created_at||''));
 message('count',books.length+'冊 登録済み');el('empty').classList.toggle('hidden',list.length>0);
 el('books').innerHTML=list.map(b=>'<button class="book" data-id="'+escapeHTML(b.id)+'">'+(b.cover_url?'<img class="cover" loading="lazy" src="'+escapeHTML(b.cover_url)+'" alt="表紙">':'<div class="cover placeholder">表紙なし</div>')+'<div class="bookname">'+escapeHTML(b.title)+'</div><div class="muted">'+escapeHTML((b.authors||[]).join('、'))+'</div><div class="stars">'+(b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):'未評価')+(b.favorite?' ♥':'')+'</div></button>').join('');
 document.querySelectorAll('.book').forEach(b=>b.onclick=()=>openBook(books.find(x=>x.id===b.dataset.id)));
}
['search','sort','filter'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));
function audibleId(v){try{let u=new URL(v);return /(^|\.)audible\.co\.jp$/.test(u.hostname)?u.pathname.match(/\/pd\/(?:[^/]+\/)?([A-Z0-9]{10})(?:\/|$)/i)?.[1]?.toUpperCase()||null:null}catch{return null}}
function openBook(b=null){editing=b;el('dialogTitle').textContent=b?'書籍詳細・編集':'書籍登録';el('bookform').reset();message('savemsg','');message('metamsg','');const fields={audible:b?.audible_url,title:b?.title,authors:b?.authors?.join(', '),narrators:b?.narrators?.join(', '),genre:b?.genre,finished:b?.finished_on,cover:b?.cover_url,description:b?.description,rating:b?.rating,notes:b?.notes};for(let [k,v] of Object.entries(fields))el(k).value=v??'';el('favorite').checked=!!b?.favorite;el('delete').classList.toggle('hidden',!b);el('overlay').classList.remove('hidden')}

el('autofill').onclick=async()=>{
 const value=el('audible').value.trim();if(!value){message('metamsg','Audibleの共有URLを入力してください。','error');return}
 if(!audibleId(value)){message('metamsg','audible.co.jp の書籍URLを入力してください。','error');return}
 el('autofill').disabled=true;message('metamsg','Audibleから書籍情報を取得しています…');
 try{
  const r=await authed('/functions/v1/audible-metadata',{method:'POST',body:{url:value}});
  const fields={title:r.title,authors:(r.authors||[]).join('、'),narrators:(r.narrators||[]).join('、'),genre:r.genre,cover:r.cover_url,description:r.description};
  let updated=0;for(const [k,v] of Object.entries(fields)){if(v&&!el(k).value.trim()){el(k).value=v;updated++}}
  message('metamsg',r.notice||(updated?'書籍情報を自動入力しました。':'取得できる情報がありませんでした。'),updated?'ok':'muted');
 }catch(e){message('metamsg','取得できませんでした: '+e.message+'（手入力で登録できます）','error')}
 finally{el('autofill').disabled=false}
};
el('add').onclick=()=>openBook();el('cancel').onclick=()=>el('overlay').classList.add('hidden');
el('bookform').onsubmit=async e=>{e.preventDefault();message('savemsg','保存中…');let url=el('audible').value.trim(),id=url?audibleId(url):null;if(url&&!id){message('savemsg','Audibleの共有URLを確認してください。');return}
 const data={title:el('title').value.trim(),audible_id:id,audible_url:id?'https://www.audible.co.jp/pd/'+id:null,authors:el('authors').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean),narrators:el('narrators').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean),genre:el('genre').value.trim()||null,finished_on:el('finished').value||null,cover_url:el('cover').value.trim()||null,description:el('description').value.trim()||null,rating:el('rating').value?Number(el('rating').value):null,favorite:el('favorite').checked,notes:el('notes').value.trim()||null};
 try{if(editing){let r=await authed('/rest/v1/books?id=eq.'+encodeURIComponent(editing.id)+'&revision=eq.'+editing.revision,{method:'PATCH',body:data,prefer:'return=representation'});if(!r.length)throw Error('他の端末で更新されています。再読み込みしてください。')}else{data.user_id=session.user.id;await authed('/rest/v1/books',{method:'POST',body:data,prefer:'return=representation'})}el('overlay').classList.add('hidden');await load()}catch(e){message('savemsg',e.message,'error')}};
el('delete').onclick=async()=>{if(!editing||!confirm('この書籍を削除しますか？'))return;try{let r=await authed('/rest/v1/books?id=eq.'+editing.id+'&revision=eq.'+editing.revision,{method:'DELETE',prefer:'return=representation'});if(!r.length)throw Error('他の端末で変更されています。再読み込みしてください。');el('overlay').classList.add('hidden');await load()}catch(e){message('savemsg',e.message,'error')}};
(async()=>{try{session=JSON.parse(localStorage.getItem('my_audible_session')||'null');if(session?.refresh_token&&await refresh()){setAuth(true);await load()}else setAuth(false)}catch{logout()}})();
</script></body></html>
