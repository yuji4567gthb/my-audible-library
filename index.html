<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#252525;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:16px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0}h2{margin-top:0}main{max-width:1050px;margin:24px auto;padding:0 16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#222;color:white}button.alt{background:#e9e9e9;color:#222}input,select,textarea{padding:11px;border:1px solid #ccc;border-radius:9px;min-width:0;width:100%;background:white}label{display:grid;gap:5px;font-size:13px}form{display:grid;gap:12px}.panel{max-width:440px;margin:45px auto;background:white;border-radius:16px;padding:24px}.muted{color:#777;font-size:13px}.error{color:#a32;white-space:pre-wrap}.ok{color:#17653b}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}.book{background:white;color:#222;text-align:left;border-radius:12px;padding:10px;box-shadow:0 2px 10px #0001}.cover{width:100%;aspect-ratio:3/4;object-fit:contain;background:#eee;border-radius:7px}.placeholder{display:grid;place-items:center;color:#888}.bookname{font-weight:650;margin:8px 0 4px;overflow-wrap:anywhere}.stars{color:#aa7820}.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:2}.dialog{background:white;padding:22px;border-radius:16px;width:min(100%,570px);max-height:95vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px}

/* Flexible layouts: small phones, foldables/duo, tablets, desktops */

<header><div><h1>My Audible Library</h1><div class="muted" id="count">聴き終わった本の記録</div></div><div><button id="enrichCategories" class="alt hidden" title="Audible掲載カテゴリを未確認の書籍から取得">カテゴリを一括補完</button> <button id="enrich2025" class="alt hidden" title="2025年登録書籍のAudible情報を一括取得">2025年の書籍情報を補完</button> <button id="bulkImport" class="alt hidden">一括登録</button> <button id="add" class="hidden">＋ 登録</button> <button id="logout" class="alt hidden">ログアウト</button></div></header>
<main><input id="importFile" class="hidden" type="file" accept=".json,application/json" aria-label="一括登録JSON"><section id="auth" class="panel"><h2>ログイン</h2><p class="muted">メールアドレスとパスワードで本棚にアクセスします。</p><form id="authform"><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><label>パスワード<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="login" type="submit">ログイン</button><button id="signup" type="button" class="alt">新規アカウント登録</button><div id="authmsg" role="status" aria-live="polite" class="muted"></div></form></section>

</div>
<div class="viewbar"><span class="muted">表示：</span><div class="viewbuttons" role="group" aria-label="本棚の表示方法"><button type="button" data-view="grid" class="active">▦ グリッド</button><button type="button" data-view="list">☷ リスト</button><button type="button" data-view="detail">☰ 詳細</button></div></div>
<div id="groupActive" class="authorfilter hidden"><span id="groupActiveText"></span><button id="clearGroup" type="button">× グループ解除</button></div><div id="categoryActive" class="authorfilter hidden"><span id="categoryActiveText"></span><button type="button" id="clearCategory">× カテゴリの絞り込みを解除</button></div><div id="authorFilter" class="authorfilter hidden"><span id="authorFilterText"></span><button id="clearAuthor" type="button">× 著者の絞り込みを解除</button></div><p id="notice" class="muted" role="status"></p><div id="categoryProgressWrap" class="hidden" style="margin:10px 0"><progress id="categoryProgress" max="1" value="0" style="width:100%" aria-label="カテゴリ一括補完の進捗"></progress></div><details id="categoryDiagnosticPanel" class="hidden"><summary>カテゴリ取得の詳しい診断結果</summary><p class="muted">カテゴリリンクとページ中の表示を記録したものです。ログイン情報は含めません。</p><textarea id="categoryDiagnostics" readonly aria-label="診断結果"></textarea><button id="copyCategoryDiagnostics" type="button" class="alt">診断結果をコピー</button></details><div id="books" class="grid"></div><p id="empty" class="muted">該当する書籍がありません。</p></section></main>
<div id="detailOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
<div class="dialog">

</div></div>

</div></div>
<div id="overlay" class="overlay hidden"><div class="dialog"><h2 id="dialogTitle">書籍登録</h2><form id="bookform"><label>Audible共有URL（任意）<input id="audible" placeholder="https://www.audible.co.jp/pd/..."></label><div><button id="autofill" type="button" class="alt">Audibleから書籍情報を取得</button><p id="metamsg" class="muted" role="status" aria-live="polite"></p></div><label>タイトル *<input id="title" required></label><label>著者（カンマ区切り）<input id="authors"></label><label>ナレーター（カンマ区切り）<input id="narrators"></label><label>Audibleカテゴリ / サブカテゴリ（1行に1件、例：文学・フィクション > ミステリー）<textarea id="categoriesInput" rows="3" placeholder="Audibleから自動取得、または手入力"></textarea></label><label>聴了日<input id="finished" type="date"></label><label>表紙画像URL<input id="cover" type="url"></label><label>概要<textarea id="description" rows="3"></textarea></label><div><label>作品の評価</label><p class="muted">もう一度この作品を聴きたいですか？</p>
<div class="choicegroup" data-choice="repeat"><button type="button" data-value="yes">↻ また聴きたい</button><button type="button" data-value="no">✓ 一度で十分</button><button type="button" class="resetChoice" data-value="unset">未評価に戻す</button></div>
</div><div><label>ナレーションの評価</label><p class="muted">この作品のナレーションは好みでしたか？</p>

<script>
'use strict';
const BASE='https://yqjemihzbuuhxsoyzkii.supabase.co',KEY='sb_publishable_v_klJ4gjzQ_K6BNtgB-AXA_oiuGb37W',el=id=>document.getElementById(id);
let session=null,books=[],editing=null,viewMode=localStorage.getItem('my_audible_view')||'grid',repeatChoice=null,voiceChoice=null,selectedAuthor=null,selectedCategory=null,selectedGroup=null,detailBook=null;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const message=(id,s,kind='')=>{el(id).textContent=s;el(id).className=kind||'muted'};
async function api(path,options={}){
 const headers={'apikey':KEY,'Content-Type':'application/json'};
 if(options.auth!==false&&session?.access_token)headers.Authorization='Bearer '+session.access_token;
 if(options.prefer)headers.Prefer=options.prefer;
 let response;
 try{response=await fetch(BASE+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)})}catch(e){throw Error('通信できません。ネットワーク接続を確認してください。 '+e.message)}
 let data=await response.text();try{data=JSON.parse(data)}catch{}
 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||'HTTP '+response.status);
 return data;
}
function setAuth(on){el('auth').classList.toggle('hidden',on);el('library').classList.toggle('hidden',!on);el('add').classList.toggle('hidden',!on);el('enrich2025').classList.toggle('hidden',!on);el('enrichCategories').classList.toggle('hidden',!on);el('bulkImport').classList.toggle('hidden',!on);el('logout').classList.toggle('hidden',!on)}
function saveSession(s){session=s;localStorage.setItem('my_audible_session',JSON.stringify(s))}
function logout(){session=null;books=[];localStorage.removeItem('my_audible_session');setAuth(false);message('count','聴き終わった本の記録')}
async function refresh(){if(!session?.refresh_token)return false;try{saveSession(await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},auth:false}));return true}catch{logout();return false}}
async function authed(path,options){try{return await api(path,options)}catch(e){if(/JWT expired|invalid JWT/i.test(e.message)&&await refresh())return api(path,options);throw e}}
el('logout').onclick=logout;
el('authform').onsubmit=async e=>{e.preventDefault();message('authmsg','ログイン中…');try{saveSession(await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:el('email').value.trim(),password:el('password').value},auth:false}));setAuth(true);await load();await handleSharedAudible()}catch(e){message('authmsg',e.message,'error')}};
el('signup').onclick=async()=>{if(!el('authform').reportValidity())return;message('authmsg','登録中…');el('signup').disabled=true;try{const r=await api('/auth/v1/signup',{method:'POST',body:{email:el('email').value.trim(),password:el('password').value},auth:false});if(r.access_token){saveSession(r);setAuth(true);await load();await handleSharedAudible()}else message('authmsg','登録を受け付けました。確認メールが届いたら、メール内のリンクを開いてからログインしてください。','ok')}catch(e){message('authmsg','新規登録エラー: '+e.message,'error')}finally{el('signup').disabled=false}};
async function load(){try{books=await authed('/rest/v1/books?select=*&order=created_at.desc');updateCategoryOptions();render();message('notice','')}catch(e){message('notice','読み込みエラー: '+e.message,'error')}}

function normalCategories(raw){
 if(!Array.isArray(raw))return [];
 const seen=new Set(),result=[];
 for(const entry of raw){
  const category=String(entry?.category||'').trim().slice(0,100),subcategory=String(entry?.subcategory||'').trim().slice(0,100);
  if(!category)continue;
  const key=category+'|'+subcategory;if(seen.has(key))continue;seen.add(key);
  result.push({category,subcategory:subcategory||null});
 }
 return result.slice(0,30);
}
function categoryLabel(c){return c.subcategory?c.category+' › '+c.subcategory:c.category}
function categoryLines(data){return normalCategories(data).map(c=>c.subcategory?c.category+' > '+c.subcategory:c.category).join('\n')}
function parseCategoryLines(str){
 const result=[];for(const line of str.split(/\r?\n/)){
  const parts=line.split(/\s*[>›]\s*/).map(x=>x.trim()).filter(Boolean);
  if(parts.length)result.push({category:parts[0],subcategory:parts.length>1?parts.slice(1).join(' › '):null});
 }
 return normalCategories(result);
}
// These are UI-only browsing groups, NOT Audible's verified parent categories.

const groupForCategory=name=>Object.entries(displayGroups).find(([,names])=>names.includes(name))?.[0]||'その他';
const bookCategoryNames=b=>normalCategories(b.audible_categories).flatMap(c=>[c.category,...(c.subcategory?[c.subcategory]:[])]);
function updateCategoryOptions(){
 const names=[...new Set(books.flatMap(bookCategoryNames))].sort((a,b)=>a.localeCompare(b,'ja'));
 const oldCat=selectedCategory;
 const oldGroup=selectedGroup;
 const groups=[...new Set(names.map(groupForCategory))].sort((a,b)=>a.localeCompare(b,'ja'));
 const groupCounts=Object.fromEntries(groups.map(g=>[g,books.filter(b=>bookCategoryNames(b).some(n=>groupForCategory(n)===g)).length]));
 el('categoryGroup').innerHTML='<option value="">分類グループ：すべて</option>'+groups.map(g=>'<option value="'+escapeHTML(g)+'">'+escapeHTML(g)+'（'+groupCounts[g]+'冊）</option>').join('');
 selectedGroup=groups.includes(oldGroup)?oldGroup:null;
 el('categoryGroup').value=selectedGroup||'';
 const filtered=names.filter(n=>!selectedGroup||groupForCategory(n)===selectedGroup);
 const counts=Object.fromEntries(filtered.map(n=>[n,books.filter(b=>bookCategoryNames(b).includes(n)).length]));
 el('categoryFilter').innerHTML='<option value="">カテゴリ：すべて</option>'+filtered.map(n=>'<option value="'+escapeHTML(n)+'">'+escapeHTML(n)+'（'+counts[n]+'冊）</option>').join('');

 el('categoryFilter').value=selectedCategory||'';
}

// iOS共有シート／ショートカットから渡されたAudible URLをログイン後に取り込む
function sharedAudibleUrl(){
 const value=new URLSearchParams(location.search).get('audible');
 if(!value)return null;
 let candidate=value.trim();
 // 共有テキスト全体が渡された場合もURL部分のみ抽出する
 const match=candidate.match(/https?:\/\/[^\s<>]+/i);
 if(match)candidate=match[0].replace(/[）)」』。,]+$/g,'');
 return audibleId(candidate)?candidate:null;
}
function clearSharedParam(){
 const u=new URL(location.href);u.searchParams.delete('audible');
 history.replaceState(null,'',u.pathname+u.search+u.hash);
}
async function handleSharedAudible(){
 const value=sharedAudibleUrl();
 if(!value)return;
 const id=audibleId(value);
 const existing=books.find(b=>b.audible_id===id);
 if(existing)showDetail(existing);else openBook();
 if(!existing)el('audible').value=value;
 clearSharedParam();
 if(existing)return;
 el('autofill').click();
}
// ローカルのJSONから安全に一括登録する。個人の読書リストは公開リポジトリには保存しない。
// 2025年の読了リストから登録した作品の書誌情報を補完する。
// 取得に失敗した作品や未取得の項目は空欄のまま。既存値を上書きしない。
el('enrich2025').onclick=async()=>{
 const targetBooks=books.filter(b=>b.finished_on==='2025-01-01'&&b.audible_id&&(!b.authors?.length||!b.narrators?.length||!b.cover_url||!b.description||!b.genre));
 if(!targetBooks.length){message('notice','2025年の補完対象はありません。');return}
 if(!confirm('2025年の読了リストから登録した '+targetBooks.length+'冊について、Audibleの情報を取得します。\n\n取得できた空欄だけを埋め、既存の入力内容・評価・聴了日は変更しません。\n時間がかかるため、完了までこの画面を開いたままにしてください。'))return;
 el('enrich2025').disabled=true;
 let completed=0,updated=0,failed=0,unavailable=0;const errors=[];
 for(const b of targetBooks){
  completed++;
  message('notice','Audible情報を確認中… '+completed+' / '+targetBooks.length+'冊（更新 '+updated+'、取得不可 '+unavailable+'、エラー '+failed+'）');
  try{
   const data=await authed('/functions/v1/audible-metadata',{method:'POST',body:{url:b.audible_url||'https://www.audible.co.jp/pd/'+b.audible_id}});
   const fields={};
   if(!b.authors?.length&&data.authors?.length)fields.authors=data.authors;
   if(!b.narrators?.length&&data.narrators?.length)fields.narrators=data.narrators;
   if(!b.cover_url&&data.cover_url)fields.cover_url=data.cover_url;
   if(!b.description&&data.description)fields.description=data.description;
   if(!b.genre&&data.genre)fields.genre=data.genre;
   if(Object.keys(fields).length){
    const rows=await authed('/rest/v1/books?id=eq.'+encodeURIComponent(b.id)+'&revision=eq.'+b.revision,{method:'PATCH',body:fields,prefer:'return=representation'});
    if(!rows.length)throw Error('別端末で更新されたためスキップ');
    b.revision=rows[0].revision;
    Object.assign(b,fields);
    updated++;
   }else unavailable++;
  }catch(e){failed++;if(errors.length<5)errors.push(b.title+': '+e.message)}
 }
 el('enrich2025').disabled=false;
 await load();
 message('notice','2025年の補完が終了しました。対象 '+targetBooks.length+'冊／情報更新 '+updated+'冊／取得できる追加情報なし '+unavailable+'冊／エラー '+failed+'冊。'+(errors.length?' '+errors.join('・'):''),failed?'error':'ok');
};

let cancelCategoryEnrich=false;
el('enrichCategories').onclick=async()=>{
 const btn=el('enrichCategories');
 if(btn.dataset.working==='yes'){
  cancelCategoryEnrich=true;message('notice','現在の書籍の処理が終わったら中断します。');return;
 }
 const candidates=books.filter(b=>b.audible_id&&!normalCategories(b.audible_categories).length)
  .sort((a,b)=>(a.audible_categories_checked_at||'').localeCompare(b.audible_categories_checked_at||''));
 if(!candidates.length){message('notice','カテゴリ未登録の書籍はありません。');return}
 if(!confirm('カテゴリ未登録の'+candidates.length+'冊を順番に補完します。完了まで画面を開いたままにしてください。既存のカテゴリ・評価・聴了日などは変更しません。'))return;
 btn.dataset.working='yes';btn.textContent='■ 補完を中断';cancelCategoryEnrich=false;
 el('categoryDiagnosticPanel').classList.add('hidden');
 let updated=0,empty=0,failed=0,attempted=0,consecutiveErrors=0,halted=false;
 const examples=[],errorExamples=[];
 const progress=el('categoryProgress');
 progress.max=candidates.length;progress.value=0;el('categoryProgressWrap').classList.remove('hidden');
 try{
  for(const b of candidates){
   if(cancelCategoryEnrich)break;
   message('notice','カテゴリ補完中 '+(attempted+1)+' / '+candidates.length+'冊（取得 '+updated+'、情報なし '+empty+'、失敗 '+failed+'）');
   try{
    const meta=await authed('/functions/v1/audible-metadata',{method:'POST',body:{url:b.audible_url||'https://www.audible.co.jp/pd/'+b.audible_id}});
    if(meta.partial&&meta.notice?.includes('取得できません'))throw Error(meta.notice);
    const cats=normalCategories(meta.audible_categories);
    if(!cats.length&&examples.length<3)examples.push({title:b.title,audible_id:b.audible_id,diagnostic:meta.category_diagnostics||null,status:meta.status||null,partial:!!meta.partial});
    const patch={audible_categories_checked_at:new Date().toISOString()};
    if(cats.length)patch.audible_categories=cats;
    const saved=await authed('/rest/v1/books?id=eq.'+encodeURIComponent(b.id)+'&revision=eq.'+b.revision,{method:'PATCH',body:patch,prefer:'return=representation'});
    if(!Array.isArray(saved)||!saved.length)throw Error('他の端末で更新されました。再実行してください。');
    Object.assign(b,saved[0]);
    if(cats.length)updated++;else empty++;
    consecutiveErrors=0;
   }catch(e){
    failed++;consecutiveErrors++;
    if(errorExamples.length<5)errorExamples.push({title:b.title,error:String(e?.message||e)});
   }
   attempted++;progress.value=attempted;
   if(consecutiveErrors>=5){halted=true;break}
   // Yield to browser rendering and avoid unnecessarily rapid requests to Audible.
   if(!cancelCategoryEnrich)await new Promise(resolve=>setTimeout(resolve,180));
  }
 }finally{
  btn.dataset.working='';btn.textContent='カテゴリを一括補完';
  el('categoryProgressWrap').classList.add('hidden');
  const stopped=cancelCategoryEnrich?'ユーザー操作で中断しました。':halted?'連続5冊のエラーで安全のため中断しました。':'';
  try{await load()}catch(e){}
  const remaining=books.filter(b=>b.audible_id&&!normalCategories(b.audible_categories).length).length;
  message('notice','カテゴリ補完結果：'+attempted+' / '+candidates.length+'冊処理、'+updated+'冊取得、'+empty+'冊で情報なし、'+failed+'冊失敗。残り未登録：'+remaining+'冊。'+stopped);
  if(examples.length||errorExamples.length){
   el('categoryDiagnosticPanel').classList.remove('hidden');
   el('categoryDiagnostics').value=JSON.stringify({date:new Date().toISOString(),attempted,total:candidates.length,updated,empty,failed,stopped,samples:examples,errors:errorExamples},null,2);
  }
 }
};

el('importFile').onchange=async e=>{
 const file=e.target.files?.[0];e.target.value='';if(!file)return;
 let parsed;
 try{parsed=JSON.parse(await file.text())}catch{alert('JSONファイルを読み込めませんでした。');return}
 if(parsed?.format!=='my-audible-library-import-v1'||!Array.isArray(parsed.books)){alert('My Audible Library用の一括登録ファイルではありません。');return}
 if(parsed.books.length>1000){alert('一度に読み込めるのは1000冊までです。');return}
 const valid=[],seen=new Set();
 for(const row of parsed.books){
  const title=typeof row?.title==='string'?row.title.trim():'';
  const aid=typeof row?.audible_id==='string'?row.audible_id.trim().toUpperCase():'';
  if(!title||title.length>500||!/^[A-Z0-9]{10}$/.test(aid)){alert('タイトルまたはAudible IDが正しくない行があります。取り込みは行っていません。');return}
  if(seen.has(aid))continue;seen.add(aid);
  valid.push({title,audible_id:aid,audible_url:'https://www.audible.co.jp/pd/'+aid,user_id:session.user.id,metadata_source:typeof parsed.source==='string'?parsed.source.slice(0,200):'一括登録'});
 }
 if(!valid.length){alert('登録対象の書籍がありません。');return}
 // 取り込み直前にサーバーの最新版を確認する
 try{await load()}catch(e){alert('本棚の再読み込みに失敗しました: '+e.message);return}
 const ids=new Set(books.map(b=>b.audible_id).filter(Boolean));
 const candidates=valid.filter(x=>!ids.has(x.audible_id));
 if(!confirm('ファイル内: '+valid.length+'冊\nすでに登録済み: '+(valid.length-candidates.length)+'冊\n新規登録: '+candidates.length+'冊\n\n既存の書籍は更新しません。評価と聴了日は空欄で登録します。実行しますか？'))return;
 if(!candidates.length){message('notice','すべて登録済みです。');return}
 el('bulkImport').disabled=true;let added=0,errors=[];
 for(let i=0;i<candidates.length;i+=20){
  const batch=candidates.slice(i,i+20);
  message('notice','一括登録中… '+Math.min(i+batch.length,candidates.length)+' / '+candidates.length+'冊');
  try{const result=await authed('/rest/v1/books',{method:'POST',body:batch,prefer:'return=representation'});added+=result.length}
  catch(ex){errors.push('行 '+(i+1)+'〜'+(i+batch.length)+': '+ex.message)}
 }
 el('bulkImport').disabled=false;
 await load();
 message('notice',added+'冊を登録しました。'+(errors.length?' 登録できなかった範囲: '+errors.join(' / '):''),errors.length?'error':'ok');
};
el('add').onclick=()=>openBook();el('cancel').onclick=()=>el('overlay').classList.add('hidden');
el('bookform').onsubmit=async e=>{e.preventDefault();message('savemsg','保存中…');let url=el('audible').value.trim(),id=url?audibleId(url):null;if(url&&!id){message('savemsg','Audibleの共有URLを確認してください。');return}
 const data={title:el('title').value.trim(),audible_id:id,audible_url:id?'https://www.audible.co.jp/pd/'+id:null,authors:el('authors').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean),narrators:el('narrators').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean),audible_categories:parseCategoryLines(el('categoriesInput').value),finished_on:el('finished').value||null,cover_url:el('cover').value.trim()||null,description:el('description').value.trim()||null,listen_again:repeatChoice,narrator_liked:voiceChoice};
 try{if(editing){let r=await authed('/rest/v1/books?id=eq.'+encodeURIComponent(editing.id)+'&revision=eq.'+editing.revision,{method:'PATCH',body:data,prefer:'return=representation'});if(!r.length)throw Error('他の端末で更新されています。再読み込みしてください。')}else{data.user_id=session.user.id;await authed('/rest/v1/books',{method:'POST',body:data,prefer:'return=representation'})}el('overlay').classList.add('hidden');await load()}catch(e){message('savemsg',e.message,'error')}};
el('delete').onclick=async()=>{if(!editing||!confirm('この書籍を削除しますか？'))return;try{let r=await authed('/rest/v1/books?id=eq.'+editing.id+'&revision=eq.'+editing.revision,{method:'DELETE',prefer:'return=representation'});if(!r.length)throw Error('他の端末で変更されています。再読み込みしてください。');el('overlay').classList.add('hidden');await load()}catch(e){message('savemsg',e.message,'error')}};
(async()=>{try{session=JSON.parse(localStorage.getItem('my_audible_session')||'null');if(session?.refresh_token&&await refresh()){setAuth(true);await load();await handleSharedAudible()}else setAuth(false)}catch{logout()}})();
</script></body></html>
